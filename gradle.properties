# Keep the build lean; the app itself is tiny.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# No AndroidX / no Jetifier: the app uses framework classes only.
android.useAndroidX=false
android.nonTransitiveRClass=true

kotlin.code.style=official

# Tiny module: compiling in-process avoids the extra daemon round-trip (and works in containers
# where $HOME is not writable for the Kotlin daemon's temp files).
kotlin.compiler.execution.strategy=in-process
